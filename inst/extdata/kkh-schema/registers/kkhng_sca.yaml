  name: scbia04
  type: numeric
  label:
    da: ~
    en: Relative Fat Mass from SECA (unit=percentage). Corrected according to manufacturers
      correction algorithm for BMI>30.
- id: scbia04_89
  name: scbia04_89
  type: numeric
  label:
    da: ~
    en: |-
      Status variable, participants with SCBIA04 below reliable machine tolerance. If 1, consider excluding all results from
      SCBIA04--SCBIA08.
- id: scbia05
  name: scbia05
  type: numeric
  label:
    da: ~
    en: Absolut Fat Mass from SECA (unit=kg). Corrected according to manufacturers
      correction algorithm for BMI>30.
- id: scbia06
  name: scbia06
  type: numeric
  label:
    da: ~
    en: Visceral Fat Mass from SECA (unit=litre). Corrected according to manufacturers
      correction algorithm for BMI>30.
- id: scbia06_88
  name: scbia06_88
  type: numeric
  label:
    da: ~
    en: Status variable, participants with SCBIA06 below SECA reliable machine tolerance
      (<0.2)
- id: scbia06_89
  name: scbia06_89
  type: numeric
  label:
    da: ~
    en: Status variable, 1 if either; SCBIA15_89 = 1,  SCBIA06 < 0 or SCBIA06 > 1000.  SCBIA06
      set to missing if SCBIA06_89 = 1
- id: scbia07
  name: scbia07
  type: numeric
  label:
    da: ~
    en: Fat free Mass from SECA (unit=kg). Corrected according to manufacturers correction
